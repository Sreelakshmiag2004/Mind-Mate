services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmate}
      POSTGRES_DB: ${POSTGRES_DB:-mindmate}
    ports:
      - "5432:5432"
    volumes:
      - mindmate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindmate} -d ${POSTGRES_DB:-mindmate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - mindmate_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket on first startup. MinIO doesn't auto-create
  # buckets, and the backend intentionally doesn't create its own bucket at
  # runtime (that's infrastructure setup, not application responsibility).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-mindmate-media}
      "

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env values so the backend always reaches Postgres
      # and MinIO by their service names on the Compose network, regardless
      # of what .env says for host-based (non-Docker) development.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mindmate}:${POSTGRES_PASSWORD:-mindmate}@postgres:5432/${POSTGRES_DB:-mindmate}
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mindmate_postgres_data:
  mindmate_minio_data:
